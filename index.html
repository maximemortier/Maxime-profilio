<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse Passive</title>
</head>
<body>
    <script>
        async function executerCollecte() {
            const donnees = {
                ua: navigator.userAgent,
                langue: navigator.language,
                plateforme: navigator.platform,
                coeurs: navigator.hardwareConcurrency || "Non détecté",
                memoire: navigator.deviceMemory || "Non détecté",
                ecran: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                webdriver: navigator.webdriver
            };

            try {
                const rep = await fetch('https://ipapi.co/json/');
                const geo = await rep.json();
                donnees.ip = geo.ip;
                donnees.ville = geo.city;
                donnees.pays = geo.country_name;
                donnees.as = geo.org;
            } catch (e) {
                donnees.erreurGeo = true;
            }

            fetch('/collecte', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(donnees)
            });
        }
        window.onload = executerCollecte;
    </script>
</body>
</html>
